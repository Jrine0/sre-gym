name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Validate environment spec
        run: python -m sre_gym.cli validate

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t sre-gym .

      - name: Check image size
        run: |
          SIZE=$(docker images sre-gym --format "{{.Size}}" | head -1)
          echo "Image size: $SIZE"

          # Convert to MB for comparison
          if echo "$SIZE" | grep -q "GB"; then
            # Convert GB to MB
            NUM=$(echo "$SIZE" | sed 's/GB//')
            SIZE_MB=$(echo "$NUM * 1000" | bc)
          elif echo "$SIZE" | grep -q "MB"; then
            SIZE_MB=$(echo "$SIZE" | sed 's/MB//')
          elif echo "$SIZE" | grep -q "KB"; then
            NUM=$(echo "$SIZE" | sed 's/KB//')
            SIZE_MB=$(echo "$NUM / 1024" | bc)
          else
            # Bytes
            NUM=$(echo "$SIZE" | sed 's/B//')
            SIZE_MB=$(echo "$NUM / 1024 / 1024" | bc)
          fi

          echo "Size in MB: $SIZE_MB"

          # Fail if exceeds 2000MB (2GB)
          if [ $(echo "$SIZE_MB > 2000" | bc) -eq 1 ]; then
            echo "FAIL: Image exceeds 2GB limit ($SIZE_MB MB)"
            exit 1
          fi
          echo "PASS: Image size is acceptable ($SIZE)"
