name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Validate environment spec
        run: python -m sre_gym.cli validate

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t sre-gym .

      - name: Check image size
        run: |
          SIZE=$(docker images sre-gym --format "{{.Size}}" | head -1)
          echo "Image size: $SIZE"

      - name: Fail if image exceeds 2GB
        run: |
          SIZE=$(docker images sre-gym --format "{{.Size}}" | head -1 | sed 's/MB//; s/GB//')
          echo "Parsed size: $SIZE"
          # Allow some tolerance - image must be under 2.1GB to account for rounding
          if echo "$SIZE > 2.1" | bc -l 2>/dev/null || [ "$SIZE" -gt 2100 ] 2>/dev/null; then
            echo "Image exceeds 2GB limit"
            exit 1
          fi
          echo "Image size is acceptable"
