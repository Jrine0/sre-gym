[project]
name = "sre-gym"
version = "0.1.0"
description = "Self-Healing Kubernetes SRE Gym - RL training environment for K8s troubleshooting"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "openenv-core>=0.2.3",
    "openai>=1.30",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
spaces = [
    "gradio>=4.0",
    "huggingface_hub>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sre_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio-mode = "auto"
